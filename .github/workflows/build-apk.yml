name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon

      # 서명키 처리 (업데이트 설치는 서명키가 같아야 하므로 매 빌드 동일 키 필요)
      # - 시크릿 SIGNING_PASSPHRASE 가 있으면:
      #     android/keystore/release.jks.enc(암호화된 키)가 없을 때 기본 브랜치에서 한 번 생성·커밋하고,
      #     있으면 복호화해서 사용. 평문 키/암호는 저장소에 절대 올리지 않음.
      # - 시크릿이 없으면 임시(debug) 키로 빌드만 하고 릴리스는 게시하지 않음.
      - name: Prepare signing key
        id: sign
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "have_key=false" >> "$GITHUB_OUTPUT"
          ENC=keystore/release.jks.enc
          JKS="$RUNNER_TEMP/release.jks"
          if [ -z "${PASS:-}" ]; then
            echo "::warning::SIGNING_PASSPHRASE 시크릿이 없어 임시 키로 빌드만 합니다 (릴리스 게시 안 함). android/README_20261103.md 참고"
            exit 0
          fi
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$JKS" -pass env:PASS
            echo "암호화된 서명키 복호화 완료"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            keytool -genkeypair -keystore "$JKS" -storetype PKCS12 -alias sinhanmacro \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=sinhanmacro" \
              -storepass:env PASS -keypass:env PASS
            mkdir -p keystore
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$JKS" -out "$ENC" -pass env:PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "chore: 암호화된 서명키 추가 (SIGNING_PASSPHRASE 로 복호화)"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            echo "새 서명키를 생성해 암호화 저장했습니다"
          else
            echo "::warning::기본 브랜치에 서명키가 아직 없어 임시 키로 빌드만 합니다"
            exit 0
          fi
          {
            echo "KEYSTORE_FILE=$JKS"
            echo "KEYSTORE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Name APK with build date
        id: apk
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y%m%d)
          OUT="sinhanmacro_v${{ github.run_number }}_${DATE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/${{ steps.apk.outputs.name }}

      # 기본 브랜치 + 고정 서명키일 때만 릴리스 게시 → 앱이 실행 시 이 릴리스(v<번호>)를 확인해 업데이트
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch && steps.sign.outputs.have_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ github.run_number }}" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "신한매크로 v${{ github.run_number }} (${{ steps.apk.outputs.date }})" \
            --notes "커밋 ${GITHUB_SHA::7} 빌드"
